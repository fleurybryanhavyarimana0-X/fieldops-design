<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FieldOps · Driver app</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<style>
  body { display: grid; place-items: start center; padding: var(--fo-5) 16px; }
  .phone { width: min(390px, 100%); background: var(--fo-surface); border: 1px solid var(--fo-line); border-radius: 28px; padding: var(--fo-5) var(--fo-4); display: grid; gap: var(--fo-4); }
  .bar { display: flex; justify-content: space-between; align-items: center; }
  .who { font-size: var(--fo-size-sm); color: var(--fo-ink-2); }
  .status { display: grid; gap: var(--fo-2); padding: var(--fo-4); border-radius: var(--fo-radius-lg); background: var(--fo-surface-2); }
  .status .big { font: 800 var(--fo-size-xxl)/1 var(--fo-display); font-variant-numeric: tabular-nums; }
  .nudge { display: grid; gap: var(--fo-3); padding: var(--fo-4); border-radius: var(--fo-radius-lg); border: 2px solid var(--fo-warn); background: var(--fo-warn-bg); }
  .nudge p { margin: 0; font-size: var(--fo-size-lg); line-height: 1.35; }
  .steps { display: grid; gap: var(--fo-3); }
  .check { display: grid; grid-template-columns: var(--fo-target-cab) 1fr; align-items: center; gap: var(--fo-3); min-height: var(--fo-target-cab); padding: 0 var(--fo-3); border: 1px solid var(--fo-line); border-radius: var(--fo-radius-lg); background: var(--fo-surface); font: 600 var(--fo-size-lg) var(--fo-text); color: var(--fo-ink); text-align: left; cursor: pointer; width: 100%; }
  .check .box { width: 32px; height: 32px; border-radius: 8px; border: 2px solid var(--fo-ink-2); display: grid; place-items: center; justify-self: center; }
  .check[aria-checked="true"] .box { background: var(--fo-ok); border-color: var(--fo-ok); color: #fff; }
  .check[aria-checked="true"] .box::after { content: "✓"; font-size: 20px; }
  .done { text-align: center; color: var(--fo-ok); font-weight: 600; min-height: 1.5em; }
  .demo { font-size: var(--fo-size-xs); color: var(--fo-ink-2); text-align: center; }
</style>
</head>
<body>
<main class="phone" aria-label="Driver app, pre-trip and in-shift">
  <div class="bar"><span class="fo-label">FieldOps</span><span class="fo-pill fo-pill--ok" id="conn">Online</span></div>
  <div class="who">loader-07 · S. Nguyen · Shift A</div>

  <section class="status" aria-label="Shift so far">
    <span class="fo-label">Shift so far</span>
    <div><span class="big">17.3</span> <span class="fo-metric__unit">km</span></div>
    <div class="who">58 min engine time · 18 min idle</div>
  </section>

  <section class="nudge" aria-live="polite" id="nudge">
    <span class="fo-label" style="color:var(--fo-warn)">Engine running, not moving</span>
    <p>You have been idling for 10 minutes at stockpile B. Switch off if you are waiting.</p>
    <button class="fo-btn fo-btn--cab" id="wait">I'm waiting to load</button>
  </section>

  <section class="steps" aria-labelledby="pt">
    <h2 class="fo-h3" id="pt">Pre-trip check</h2>
    <button class="check" role="checkbox" aria-checked="true"><span class="box" aria-hidden="true"></span>Tires and wheels</button>
    <button class="check" role="checkbox" aria-checked="true"><span class="box" aria-hidden="true"></span>Lights and horn</button>
    <button class="check" role="checkbox" aria-checked="false"><span class="box" aria-hidden="true"></span>Coolant level</button>
    <button class="check" role="checkbox" aria-checked="false"><span class="box" aria-hidden="true"></span>Bucket and hydraulics</button>
    <button class="fo-btn fo-btn--cab fo-btn--primary" id="submit">Submit check</button>
    <div class="done" id="done" aria-live="polite"></div>
  </section>
  <p class="demo">Demo data</p>
</main>
<script>
document.querySelectorAll(".check").forEach(b => b.addEventListener("click", () => b.setAttribute("aria-checked", b.getAttribute("aria-checked") !== "true")));
document.getElementById("submit").addEventListener("click", () => {
  const left = [...document.querySelectorAll(".check")].filter(b => b.getAttribute("aria-checked") !== "true").length;
  document.getElementById("done").textContent = left ? `${left} item${left > 1 ? "s" : ""} still to check` : "Check sent to dispatch";
  document.getElementById("done").style.color = left ? "var(--fo-warn)" : "var(--fo-ok)";
});
document.getElementById("wait").addEventListener("click", () => {
  document.getElementById("nudge").innerHTML = '<span class="fo-label" style="color:var(--fo-ok)">Noted</span><p>Dispatch can see you are waiting to load. The idle alert is paused for 15 minutes.</p>';
  document.getElementById("nudge").style.borderColor = "var(--fo-ok)";
  document.getElementById("nudge").style.background = "var(--fo-ok-bg)";
});
</script>
</body>
</html>
